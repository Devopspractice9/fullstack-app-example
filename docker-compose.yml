
services:
  frontend:
    image: fullstack-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: fullstack-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5001:5000"
    restart: unless-stopped
